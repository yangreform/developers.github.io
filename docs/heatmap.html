<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandlordSG · 新加坡房产热力图</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LandlordSG">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- SEO & Open Graph (Social Preview) -->
  <meta name="description" content="全岛私宅与商办热力图行情分析，掌握新加坡房市与宏观指标趋势。提供 URA 私宅与商办/店面最新成交资料。">
  <meta property="og:title" content="LandlordSG 新加坡房产热力图 | 私宅与商办/店面成交地图">
  <meta property="og:description" content="LandlordSG 新加坡房产热力图 — 即时视觉化 URA 私宅与商办/店面的成交价格、呎价与交易量分布">
  <meta property="og:image" content="https://profjacky.github.io/assets/img/heat.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://profjacky.github.io/heatmap.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LandlordSG - 新加坡房产即时资料库">
  <meta name="twitter:description" content="全岛私宅热力图与行情分析，掌握新加坡房市与宏观指标趋势。">
  <meta name="twitter:image" content="https://yangreform.github.io/developers.github.io/assets/seo_chart.jpg">

  <!-- Leaflet.js（免费地图，无需 API Key） -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- leaflet-heat 热力图插件 -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg-dark:#0a0e1a;
      --panel-bg:rgba(15,20,40,0.88);
      --panel-border:rgba(99,179,237,0.18);
      --accent:#63b3ed;
      --accent2:#f6ad55;
      --text-primary:#e8f0fe;
      --text-muted:#8899bb;
      --tag-ura:rgba(99,179,237,0.25);
      --tag-hdb:rgba(246,173,85,0.25);
      --tag-all:rgba(154,205,50,0.25);
      --btn-active:rgba(99,179,237,0.3);
      --btn-hover:rgba(99,179,237,0.12);
      --shadow-glow:0 0 24px rgba(99,179,237,0.15);
    }
    html,body{width:100%;height:100%;font-family:'Inter',sans-serif;background:var(--bg-dark);color:var(--text-primary);overflow:hidden}

    /* ── Map ── */
    #map{position:absolute;inset:0;width:100%;height:100%;z-index:0}

    /* ── Top Bar ── */
    #topbar{
      position:fixed;top:0;left:0;right:0;z-index:1000;
      display:flex;align-items:center;gap:12px;padding:12px 20px;
      background:var(--panel-bg);border-bottom:1px solid var(--panel-border);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow-glow);flex-wrap:wrap;
    }
    .logo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .logo-icon{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg,#63b3ed,#4299e1);
      display:flex;align-items:center;justify-content:center;
      font-size:18px;box-shadow:0 0 14px rgba(99,179,237,0.45);
    }
    .logo-text{font-size:17px;font-weight:700;background:linear-gradient(90deg,#63b3ed,#90cdf4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .logo-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
    .divider-v{width:1px;height:32px;background:var(--panel-border);flex-shrink:0}
    .ctrl-group{display:flex;flex-direction:column;gap:4px}
    .ctrl-label{font-size:10px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px}
    .btn-row{display:flex;gap:4px}
    .btn-pill{
      padding:5px 12px;border-radius:20px;border:1px solid var(--panel-border);
      background:transparent;color:var(--text-muted);font-size:12px;font-weight:500;
      cursor:pointer;transition:all 0.2s ease;font-family:inherit;white-space:nowrap;
    }
    .btn-pill:hover{background:var(--btn-hover);color:var(--text-primary);border-color:rgba(99,179,237,0.35)}
    .btn-pill.active{background:var(--btn-active);color:var(--accent);border-color:rgba(99,179,237,0.55);box-shadow:0 0 10px rgba(99,179,237,0.2)}
    .btn-pill.type-ura.active{background:var(--tag-ura);color:#63b3ed;border-color:rgba(99,179,237,0.5)}
    .btn-pill.type-commercial.active{background:var(--tag-hdb);color:#f6ad55;border-color:rgba(246,173,85,0.5)}
    .btn-pill.type-all.active{background:var(--tag-all);color:#9acd32;border-color:rgba(154,205,50,0.5)}
    #year-select{
      padding:5px 10px;border-radius:20px;border:1px solid var(--panel-border);
      background:transparent;color:var(--text-primary);font-size:12px;
      font-family:inherit;cursor:pointer;outline:none;transition:all 0.2s;
    }
    #year-select:hover,#year-select:focus{border-color:rgba(99,179,237,0.45);background:var(--btn-hover)}
    #year-select option{background:#0f1428;color:#e8f0fe}
    .spacer{flex:1}
    #btn-refresh{
      padding:7px 16px;border-radius:20px;border:1px solid rgba(99,179,237,0.4);
      background:linear-gradient(135deg,rgba(99,179,237,0.2),rgba(66,153,225,0.15));
      color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;
      font-family:inherit;transition:all 0.2s ease;display:flex;align-items:center;gap:6px;
    }
    #btn-refresh:hover{background:linear-gradient(135deg,rgba(99,179,237,0.35),rgba(66,153,225,0.28));box-shadow:0 0 16px rgba(99,179,237,0.25)}
    #btn-refresh:disabled{opacity:0.45;cursor:not-allowed}

    /* ── Back Button ── */
    #btn-back{
      padding:6px 14px;border-radius:20px;border:1px solid var(--panel-border);
      background:transparent;color:var(--text-muted);font-size:12px;
      cursor:pointer;font-family:inherit;transition:all 0.2s;text-decoration:none;
      display:flex;align-items:center;gap:5px;
    }
    #btn-back:hover{background:var(--btn-hover);color:var(--text-primary)}

    /* ── Loading ── */
    #loading{
      position:fixed;inset:0;z-index:2000;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      background:rgba(10,14,26,0.9);backdrop-filter:blur(8px);transition:opacity 0.4s ease;
    }
    #loading.hidden{opacity:0;pointer-events:none}
    .spinner{width:52px;height:52px;border:3px solid rgba(99,179,237,0.2);border-top-color:#63b3ed;border-radius:50%;animation:spin 0.9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-text{font-size:14px;color:var(--text-muted)}

    /* ── Combined Legend & Stats Panel ── */
    #stats-panel{
      position:fixed;bottom:28px;right:20px;z-index:1000;
      background:var(--panel-bg);border:1px solid var(--panel-border);
      border-radius:16px;padding:16px 20px;
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow-glow);min-width:210px;
    }
    .stats-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:10px}
    .stat-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
    .stat-row:last-child{margin-bottom:0}
    .stat-key{font-size:12px;color:var(--text-muted)}
    .stat-val{font-size:13px;font-weight:600;color:var(--text-primary)}
    .stat-val.ura{color:#63b3ed}.stat-val.commercial{color:#f6ad55}

    .legend-title{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:8px}
    .legend-gradient{width:100%;height:8px;border-radius:4px;margin-bottom:6px;background:linear-gradient(to right,#0000ff,#00ffff 25%,#00ff00 50%,#ffff00 75%,#ff0000)}
    .legend-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted)}

    /* ── Tooltip ── */
    .leaflet-tooltip-custom{
      background:var(--panel-bg)!important;
      border:1px solid var(--panel-border)!important;
      border-radius:12px!important;color:var(--text-primary)!important;
      font-family:'Inter',sans-serif!important;font-size:13px!important;
      padding:10px 14px!important;backdrop-filter:blur(16px)!important;
      box-shadow:0 8px 32px rgba(0,0,0,0.4)!important;
    }
    .tip-name{font-weight:600;margin-bottom:4px}
    .tip-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;margin-bottom:6px}
    .badge-ura{background:var(--tag-ura);color:#63b3ed}
    .badge-commercial{background:var(--tag-hdb);color:#f6ad55}
    .tip-val{color:var(--text-muted);font-size:12px}

    /* ── Toast ── */
    #toast{
      position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);z-index:3000;
      background:rgba(229,62,62,0.9);color:#fff;padding:10px 20px;border-radius:8px;
      font-size:13px;opacity:0;transition:all 0.3s ease;pointer-events:none;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:640px){
      #topbar{gap:8px;padding:10px 14px}
      .logo-sub,.divider-v{display:none}
      #stats-panel{bottom:12px;right:12px;left:auto;min-width:180px;padding:12px 14px}
    }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo-wrap">
    <div class="logo-icon">&#127968;</div>
    <div>
      <div class="logo-text">LandlordSG</div>
      <div class="logo-sub">新加坡房产热力图</div>
    </div>
  </div>
  <div class="divider-v"></div>

  <div class="ctrl-group">
    <div class="ctrl-label">资料类型</div>
    <div class="btn-row" id="type-btns">
      <button class="btn-pill type-ura" data-type="ura">&#127961;&#65039; URA 私宅</button>
      <button class="btn-pill type-commercial" data-type="commercial">&#127980; 商办 / 店面</button>
      <button class="btn-pill type-all active" data-type="all">&#128506;&#65039; 全部</button>
    </div>
  </div>
  <div class="divider-v"></div>

  <div class="ctrl-group">
    <div class="ctrl-label">指标</div>
    <div class="btn-row" id="metric-btns">
      <button class="btn-pill active" data-metric="price">&#128176; 成交价</button>
      <button class="btn-pill" data-metric="psf">&#128208; 呎价</button>
      <button class="btn-pill" data-metric="count">&#128202; 交易量</button>
    </div>
  </div>
  <div class="divider-v"></div>

  <div class="ctrl-group">
    <div class="ctrl-label">年份</div>
    <select id="year-select">
      <option value="all">全部年份</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
      <option value="2023">2023</option>
      <option value="2022">2022</option>
      <option value="2021">2021</option>
      <option value="2020">2020</option>
      <option value="2019">2019</option>
      <option value="2018">2018</option>
      <option value="2017">2017</option>
    </select>
  </div>

  <div class="spacer"></div>

  <a href="LandlordSG.html" id="btn-back">&#8592; 首页</a>

  <button id="btn-refresh" onclick="loadHeatmap()">
    <span id="refresh-icon">&#128260;</span> 更新地图
  </button>
</div>

<div id="map"></div>

<div id="loading">
  <div class="spinner"></div>
  <div class="loading-text" id="loading-text">正在载入地图...</div>
</div>

<div id="stats-panel">
  <div class="legend-title" style="display:flex;justify-content:space-between;align-items:center;">
    <span>热度指标</span>
    <span id="legend-metric-label" style="font-size:11px;color:#63b3ed;text-transform:none;font-weight:600;">平均成交价</span>
  </div>
  <div class="legend-gradient"></div>
  <div class="legend-labels" style="margin-bottom:12px;">
    <span>低</span>
    <span>高</span>
  </div>
  <div style="height:1px;background:var(--panel-border);margin-bottom:12px;"></div>
  <div class="stats-title">&#128202; 资料统计</div>
  <div class="stat-row"><span class="stat-key">资料笔数</span><span class="stat-val" id="stat-count">—</span></div>
  <div class="stat-row"><span class="stat-key">URA 私宅</span><span class="stat-val ura" id="stat-ura">—</span></div>
  <div class="stat-row"><span class="stat-key">商办 / 店面</span><span class="stat-val commercial" id="stat-commercial">—</span></div>
  <div class="stat-row"><span class="stat-key">最高值</span><span class="stat-val" id="stat-max">—</span></div>
</div>

<div id="toast"></div>

<script>
  // ── API 网址（后端 ngrok / GCP）──────────────────────────────
  const API_BASE = 'https://imelda-nondeferent-deformedly.ngrok-free.dev/app';

  let map, heatLayer;
  let markers = [];
  let currentData = [];
  
  const urlParams = new URLSearchParams(window.location.search);
  let selType = urlParams.get('type') || 'all';
  let selMetric = urlParams.get('metric') || 'price';
  let selYear = urlParams.get('year') || 'all';

  // 同步 URL 参数到按钮与选单
  document.querySelectorAll('#type-btns .btn-pill').forEach(function(b) {
    b.classList.toggle('active', b.dataset.type === selType);
  });
  document.querySelectorAll('#metric-btns .btn-pill').forEach(function(b) {
    b.classList.toggle('active', b.dataset.metric === selMetric);
  });
  if (document.getElementById('year-select')) {
    document.getElementById('year-select').value = selYear;
  }

  // ── 初始化 Leaflet 地图 ─────────────────────────────────────
  function initMap() {
    map = L.map('map', {
      center: [1.3521, 103.8198],
      zoom: 12,
      zoomControl: true,
    });

    // 深色地图底图（CartoDB Dark Matter，免费、无需 API Key）
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
      subdomains: 'abcd',
      maxZoom: 19,
    }).addTo(map);

    hideLoading();
    loadHeatmap();
  }

  // ── 载入资料 ────────────────────────────────────────────────
  async function loadHeatmap() {
    showLoading('正在从伺服器取得资料...');
    setRefreshDisabled(true);
    try {
      const url = API_BASE + '/api/get_heatmap_data?type=' + selType + '&metric=' + selMetric + '&year=' + selYear;
      const resp = await fetch(url, {
        headers: { 'ngrok-skip-browser-warning': '1' }
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const json = await resp.json();
      if (json.status !== 'success') throw new Error(json.message || '伺服器错误');
      currentData = json.data || [];
      renderHeatmap(currentData, json.metric);
      updateStats(currentData, json.metric);
      updateLegendLabel(json.metric);

      // 如果 URL 中有 project 参数，自动缩放
      const proj = urlParams.get('project');
      if (proj && currentData.length) {
         const target = currentData.find(d => d.label === proj || (d.label && d.label.includes(proj)));
         if (target && target.lat && target.lng) {
             map.setView([target.lat, target.lng], 16);
         }
      }
    } catch (err) {
      showToast('无法载入资料：' + err.message);
      console.error('[HeatmapError]', err);
    } finally {
      hideLoading();
      setRefreshDisabled(false);
    }
  }

  // ── 渲染热力图 ──────────────────────────────────────────────
  function renderHeatmap(data, metric) {
    // 移除旧 heatLayer 和 markers
    if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }
    markers.forEach(function(m) { map.removeLayer(m); });
    markers = [];

    if (!data || !data.length) return;

    // 计算 95% 分位数作为最大值（避免极端值导致整体颜色偏冷）
    var weights = data.map(function(d){ return d.weight || 0; }).sort(function(a,b){return a-b;});
    var maxW = weights[Math.floor(weights.length * 0.95)] || 1;

    // leaflet-heat 格式：[[lat, lng, intensity], ...]
    var heatPoints = [];
    data.forEach(function(d) {
      if (!d.lat || !d.lng || !d.weight) return;
      var intensity = d.weight / maxW;  // 0~1
      heatPoints.push([d.lat, d.lng, intensity]);
    });

    heatLayer = L.heatLayer(heatPoints, {
      radius: 30,
      blur: 20,
      maxZoom: 17,
      max: 1.0,
      gradient: {
        0.0: '#0000ff',
        0.3: '#00ffff',
        0.5: '#00ff00',
        0.7: '#ffff00',
        1.0: '#ff0000'
      }
    }).addTo(map);

    // 建立同比例热度颜色圆点（并绑定 tooltip）
    function getColor(intensity) {
      if (intensity > 0.8) return '#ff0000';
      if (intensity > 0.6) return '#ffff00';
      if (intensity > 0.4) return '#00ff00';
      if (intensity > 0.2) return '#00ffff';
      return '#0000ff';
    }

    data.forEach(function(d) {
      if (!d.lat || !d.lng) return;
      
      var intensity = (d.weight || 0) / maxW;
      if (intensity > 1) intensity = 1;

      var m = L.circleMarker([d.lat, d.lng], {
        radius: 7,
        color: '#0a0e1a', // Dark border for contrast
        fillColor: getColor(intensity),
        fillOpacity: 0.8,
        weight: 1
      });

      var valText = '';
      if (metric === 'count')       valText = '交易量：' + Math.round(d.weight).toLocaleString() + ' 笔';
      else if (metric === 'psf')    valText = '平均呎价：S$ ' + Math.round(d.weight).toLocaleString();
      else                          valText = '平均成交价：S$ ' + Math.round(d.weight).toLocaleString();

      var badgeClass = d.source === 'ura' ? 'badge-ura' : 'badge-commercial';
      var badgeText  = d.source === 'ura' ? 'URA 私宅' : '商办 / 店面';
      var html = '<div class="tip-name">' + (d.label || '') + '</div>'
               + '<span class="tip-badge ' + badgeClass + '">' + badgeText + '</span><br>'
               + '<div class="tip-val">' + valText + '</div>';

      m.bindTooltip(html, {
        className: 'leaflet-tooltip-custom',
        direction: 'top',
        offset: [0, -5]
      });

      m.addTo(map);
      markers.push(m);
    });

    // 缩放时调整 radius
    map.on('zoomend', function() {
      if (!heatLayer) return;
      var z = map.getZoom();
      var r = Math.max(15, Math.min(60, (z - 10) * 10));
      heatLayer.setOptions({ radius: r });
    });
  }

  // ── 统计资讯 ────────────────────────────────────────────────
  function updateStats(data, metric) {
    var uraCount = 0, commercialCount = 0, maxW = 0;
    data.forEach(function(d) {
      if (d.source === 'ura') uraCount++;
      else commercialCount++;
      if ((d.weight || 0) > maxW) maxW = d.weight;
    });
    document.getElementById('stat-count').textContent = data.length.toLocaleString();
    document.getElementById('stat-ura').textContent   = uraCount;
    document.getElementById('stat-commercial').textContent = commercialCount;
    var maxLabel = (metric === 'count')
      ? Math.round(maxW).toLocaleString() + ' 笔'
      : 'S$ ' + Math.round(maxW).toLocaleString();
    document.getElementById('stat-max').textContent = maxLabel;
  }

  function updateLegendLabel(metric) {
    var labels = { price: '平均成交价', psf: '平均呎价(PSF)', count: '交易笔数' };
    document.getElementById('legend-metric-label').textContent = labels[metric] || metric;
  }

  // ── UI 控制 ──────────────────────────────────────────────────
  function showLoading(msg) {
    document.getElementById('loading-text').textContent = msg || '载入中...';
    document.getElementById('loading').classList.remove('hidden');
  }
  function hideLoading() {
    document.getElementById('loading').classList.add('hidden');
  }
  function setRefreshDisabled(v) {
    document.getElementById('btn-refresh').disabled = v;
    document.getElementById('refresh-icon').textContent = v ? '\u23F3' : '\uD83D\uDD04';
  }
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 4000);
  }

  // ── 按钮事件 ─────────────────────────────────────────────────
  document.querySelectorAll('#type-btns .btn-pill').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#type-btns .btn-pill').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      selType = btn.dataset.type;
      loadHeatmap();
    });
  });
  document.querySelectorAll('#metric-btns .btn-pill').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('#metric-btns .btn-pill').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      selMetric = btn.dataset.metric;

    });

    loadHeatmap();
  });

  window.addEventListener('load', initMap);
</script>
